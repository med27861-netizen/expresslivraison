<style>
:root{
  --navy:#0B1B3A;
  --navy-2:#132A52;
  --red:#E31E24;
  --red-dark:#B8151A;
  --orange:#F5810A;
  --paper:#F7F8FA;
  --paper-2:#EEF0F4;
  --white:#FFFFFF;
  --slate:#64748B;
  --line:#E2E5EA;
  --green:#16A34A;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(11,27,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--navy);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
h1,h2,h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
img{max-width:100%;display:block;}

.rolebar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;font-size:12px;padding:8px 16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
.rolebar span{opacity:.6;margin-right:4px;}
.rolebar button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;}
.rolebar button.active{background:var(--orange);color:#fff;border-color:var(--orange);}

.nav{position:sticky;top:33px;z-index:40;background:rgba(247,248,250,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;max-width:1120px;margin:0 auto;gap:12px;}
.logo{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--navy);}
.logo svg{flex-shrink:0;}
.navlinks{display:none;gap:18px;font-size:13.5px;font-weight:600;color:var(--slate);}
.navlinks a:hover{color:var(--navy);}
.cta-mini{background:var(--red);color:#fff!important;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;white-space:nowrap;}
@media(min-width:900px){.navlinks{display:flex;}}

.hero{padding:52px 0 20px;position:relative;overflow:hidden;}
.hero-grid{display:grid;grid-template-columns:1fr;gap:36px;align-items:center;}
@media(min-width:900px){.hero-grid{grid-template-columns:1.1fr 1fr;}}
.badge-pill{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--red);margin-bottom:18px;box-shadow:var(--shadow);}
.hero h1{font-size:32px;font-weight:800;margin:0 0 14px;line-height:1.1;max-width:13ch;}
@media(min-width:700px){.hero h1{font-size:46px;}}
.hero p.sub{font-size:16px;color:var(--slate);max-width:44ch;margin:0 0 26px;}
.hero-ctas{display:flex;flex-direction:column;gap:12px;max-width:340px;}
@media(min-width:520px){.hero-ctas{flex-direction:row;max-width:none;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;font-size:14.5px;padding:15px 24px;border:none;transition:transform .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--line);}
.btn-block{width:100%;}
.btn-lg{padding:18px 26px;font-size:15.5px;}
.btn-sm{padding:9px 14px;font-size:12px;border-radius:999px;}

.hero-visual{position:relative;background:linear-gradient(160deg,var(--navy),var(--navy-2));border-radius:24px;padding:26px;min-height:300px;overflow:hidden;box-shadow:var(--shadow);}
.hero-visual .glow{position:absolute;width:220px;height:220px;background:radial-gradient(circle,rgba(245,129,10,.35),transparent 70%);top:-40px;right:-40px;}
.hero-visual svg{position:relative;z-index:1;width:100%;height:auto;}

.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:40px;}
@media(min-width:700px){.stats4{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.stat-card .ic{font-size:22px;margin-bottom:8px;}
.stat-card b{display:block;font-family:'Space Grotesk';font-size:14px;letter-spacing:.02em;}
.stat-card span{font-size:12.5px;color:var(--slate);}

section{padding:52px 0;}
.section-head{margin-bottom:28px;text-align:center;}
.section-head .badge-pill{margin-left:auto;margin-right:auto;}
.section-head h2{font-size:27px;margin:0 0 8px;}
.section-head p{color:var(--slate);margin:0 auto;max-width:52ch;}

/* MAP */
.map-section{background:var(--navy);border-radius:28px;padding:44px 24px;color:#fff;position:relative;overflow:hidden;}
.map-section .section-head h2,.map-section .section-head p{color:#fff;}
.map-section .section-head p{color:#B9C2D6;}
.map-wrap{max-width:520px;margin:0 auto;position:relative;}
.map-wrap svg{width:100%;height:auto;}
.map-legend{display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:12px;color:#B9C2D6;flex-wrap:wrap;}
.map-legend span{display:inline-flex;align-items:center;gap:6px;}
.dotleg{width:8px;height:8px;border-radius:50%;display:inline-block;}
.city-pulse{animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.route-anim{stroke-dasharray:6 6;animation:dashmove 3.5s linear infinite;}
@keyframes dashmove{to{stroke-dashoffset:-120;}}
.radar-ring{animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){.city-pulse,.route-anim,.radar-ring{animation:none;}}

.steps4{display:grid;gap:16px;grid-template-columns:1fr;}
@media(min-width:700px){.steps4{grid-template-columns:repeat(4,1fr);}}
.step-c{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative;}
.step-c .n{font-family:'Space Grotesk';font-weight:800;font-size:26px;color:var(--red);opacity:.25;margin-bottom:8px;}
.step-c h3{font-size:15.5px;margin:0 0 6px;}
.step-c p{font-size:13px;color:var(--slate);margin:0;}

.services-grid{display:grid;gap:16px;grid-template-columns:1fr;}
@media(min-width:640px){.services-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:980px){.services-grid{grid-template-columns:repeat(3,1fr);}}
.service-c{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:box-shadow .2s;}
.service-c:hover{box-shadow:var(--shadow);}
.service-c .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;}
.service-c h3{font-size:15.5px;margin:0 0 6px;}
.service-c p{font-size:13px;color:var(--slate);margin:0;}

footer{border-top:1px solid var(--line);padding:40px 0;margin-top:10px;background:var(--white);}
.foot-grid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:26px;}
.foot-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin:0 0 10px;}
.foot-col a,.foot-col p{display:block;font-size:14px;margin-bottom:6px;color:var(--navy);}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;margin-top:6px;}
.foot-social{display:flex;gap:10px;margin-top:8px;}
.foot-social a{width:34px;height:34px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:14px;}

/* FORM SHELL */
.form-shell{max-width:580px;margin:0 auto;padding:36px 20px 60px;}
.progress{display:flex;gap:6px;margin-bottom:24px;}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--line);}
.progress i.done{background:var(--red);}
.stepmeta{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.form-shell h2{margin:0 0 4px;font-size:22px;}
.form-shell>p.hint{color:var(--slate);font-size:14px;margin:0 0 22px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:var(--white);color:var(--navy);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--red);border-color:var(--red);}
.field textarea{resize:vertical;min-height:70px;}
.field.error input,.field.error select,.field.error textarea{border-color:var(--red);background:#FFF1F1;}
.field.error label{color:var(--red);}
.form-actions{display:flex;gap:10px;margin-top:22px;}
.recap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:18px 0;}
.recap-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--paper-2);}
.recap-row:last-child{border-bottom:none;}
.recap-row b{font-family:'Space Grotesk';}
.recap-total{background:var(--navy);color:#fff;border-radius:var(--radius-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:12px;}
.recap-total .val{font-family:'Space Grotesk';font-size:20px;color:var(--orange);}
.errbox{background:#FFF1F1;border:1px solid #FFC7C7;color:#B8151A;font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;}

.confirm-box{text-align:center;padding:16px 0;}
.confirm-box .check{width:56px;height:56px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px;color:#fff;}
.tracknum{font-family:'Space Grotesk';font-weight:700;font-size:21px;background:var(--white);border:1.5px dashed var(--red);display:inline-block;padding:10px 18px;border-radius:var(--radius-sm);margin:10px 0 22px;}

.label-section{margin:22px 0;}
.label-pkg-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
.label-pkg-row .lbl{font-size:13px;font-weight:700;}
.label-pkg-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* TRACKING */
.track-input-row{display:flex;gap:8px;margin-bottom:28px;}
.track-input-row input{flex:1;}
.timeline{position:relative;padding-left:34px;}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:24px;}
.tl-item .dot{position:absolute;left:-34px;top:0;width:24px;height:24px;border-radius:50%;background:var(--white);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;}
.tl-item.done .dot{background:var(--green);border-color:var(--green);color:#fff;}
.tl-item.current .dot{background:var(--red);border-color:var(--red);color:#fff;}
.tl-item.fail .dot{background:var(--red);border-color:var(--red);color:#fff;}
.tl-item h4{margin:0 0 2px;font-size:15px;}
.tl-item span{font-size:12px;color:var(--slate);}
.tl-item.pending h4,.tl-item.pending span{color:#B4BBC6;}

/* SEARCHABLE CITY FIELD (datalist) */
.city-field{position:relative;}
.city-field input{width:100%;}
.city-hint{position:absolute;right:14px;top:14px;font-size:14px;opacity:.5;}

/* COURIER */
.courier-topbar{background:var(--navy);color:#fff;padding:16px 20px;}
.courier-topbar select{background:var(--paper);border:none;border-radius:8px;padding:8px 10px;font-weight:600;}
.job-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.job-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.job-card .tn{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.b-new{background:#E7ECFF;color:var(--navy);}
.b-progress{background:#FFEEDC;color:#95500B;}
.b-done{background:#DBF6E3;color:#0F7A34;}
.b-fail{background:#FFE1DA;color:#B8151A;}
.job-card .rowinfo{font-size:13px;color:var(--slate);margin-bottom:3px;}
.job-card .rowinfo b{color:var(--navy);}
.job-actions{display:flex;gap:8px;margin-top:12px;}
.job-actions button{flex:1;padding:12px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;border:none;}
.b-livre{background:var(--green);color:#fff;}
.b-retour{background:#fff;color:var(--red);border:1.5px solid var(--red)!important;}

.modal-bg{position:fixed;inset:0;background:rgba(11,27,58,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:600px){.modal-bg{align-items:center;}}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 30px;max-width:460px;width:100%;max-height:85vh;overflow:auto;}
@media(min-width:600px){.modal{border-radius:20px;}}
.modal h3{margin:0 0 14px;}
.reason-opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:#fff;font-size:14px;}
.reason-opt.selected{border-color:var(--red);background:#FFF1F1;font-weight:600;}

/* ADMIN */
.admin-wrap{padding:26px 20px 60px;max-width:1160px;margin:0 auto;}
.admin-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.admin-tabs button{padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;}
.admin-tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
@media(min-width:700px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;}
.kpi b{font-family:'Space Grotesk';font-size:21px;display:block;}
.kpi span{font-size:12px;color:var(--slate);}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:22px;}
.chart-box h4{margin:0 0 14px;font-size:13px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.bar-row .lbl{width:140px;flex-shrink:0;color:var(--slate);}
.bar-track{flex:1;background:var(--paper-2);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--orange));border-radius:6px;}
.bar-val{width:34px;text-align:right;font-weight:700;font-family:'Space Grotesk';}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);font-size:13px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--paper-2);white-space:nowrap;}
th{background:var(--paper-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);}
tr:last-child td{border-bottom:none;}
.table-scroll{overflow-x:auto;border-radius:var(--radius);}
.mini-select{padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;}
.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.searchbar input,.searchbar select{padding:10px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;}
.city-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto auto;gap:8px;background:#fff;border:1px solid var(--line);padding:10px;border-radius:10px;margin-bottom:8px;align-items:center;font-size:13px;}
.city-row input{padding:7px;border-radius:6px;border:1px solid var(--line);width:100%;}
.toggle-avail{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;border:none;}
.toggle-on{background:#DBF6E3;color:#0F7A34;}
.toggle-off{background:#F0F0F2;color:#888;}
.rm-btn{background:#FFE1DA;color:var(--red);border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;}
.empty{text-align:center;color:var(--slate);padding:40px 0;font-size:14px;}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.addbar input{flex:1;min-width:120px;padding:10px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;}
</style>
</head>

/* ---------------- AUTH HELPERS ---------------- */
async function ensureClientAuth(){
  if(!auth) return null;
  if(auth.currentUser) return auth.currentUser;
  try{ const cred = await auth.signInAnonymously(); return cred.user; }
  catch(e){ console.error('Anonymous auth failed', e); return null; }
}
async function fetchUserDoc(uid){
  if(!db) return null;
  try{ const snap = await db.collection('users').doc(uid).get(); return snap.exists ? snap.data() : null; }
  catch(e){ console.error('fetchUserDoc error', e); return null; }

async function bootstrapFirstAdmin(name, phone, email, password){

  const uid = cred.user.uid;
  const userDoc = { uid, name, phone, email, role:'admin', active:true, createdAt: Date.now() };
  try{
    await db.runTransaction(async(tx)=>{
      const metaRef = db.collection('meta').doc('adminBootstrap');
      const metaSnap = await tx.get(metaRef);
      if(metaSnap.exists && metaSnap.data().done){ throw new Error('ALREADY_DONE'); }
      tx.set(metaRef, { done:true, at:Date.now() });
      tx.set(db.collection('users').doc(uid), userDoc);
    });
  }catch(e){
    // rollback the auth account if bootstrap already used, to avoid orphaned accounts
    try{ await cred.user.delete(); }catch(_e){}
    throw e;
  }
  return userDoc;
}

async function createOrder(orderData){
  const counterRef = db.collection('counters').doc('trackingNumber');
  const trackingNumber = await db.runTransaction(async(tx)=>{
    const snap = await tx.get(counterRef);
    const current = snap.exists ? snap.data().current : 0;
    const next = current + 1;
    const tn = 'EL-2026-' + String(next).padStart(6,'0');
    const orderRef = db.collection('orders').doc(tn);
    tx.set(counterRef, { current: next });
    tx.set(orderRef, { ...orderData, trackingNumber: tn, createdAt: Date.now(), updatedAt: Date.now() });
    return tn;
  });
  try{
    await db.collection('orders').doc(trackingNumber).collection('statusHistory').add({
      status:'nouvelle_demande', timestamp: Date.now(), changedBy: orderData.clientUid||'guest', changedByRole:'client', note:null
    });
  }catch(e){ console.error('statusHistory init write failed', e); }
  return { ...orderData, id: trackingNumber, trackingNumber, createdAt: new Date().toISOString(), status:'nouvelle_demande' };
}
async function getOrderByTracking(trackingNumber){
  if(!db) return null;
  try{
    const snap = await db.collection('orders').doc(trackingNumber.trim().toUpperCase()).get();
    if(!snap.exists) return false;
    const data = snap.data();
    return { ...data, id: snap.id, createdAt: data.createdAt ? new Date(data.createdAt).toISOString() : new Date().toISOString() };
  }catch(e){ console.error('getOrderByTracking error', e); return false; }
}
async function updateOrder(orderId, patch, historyEntry){
  if(!db) throw new Error('NO_DB');
  const ref = db.collection('orders').doc(orderId);
  await ref.update({ ...patch, updatedAt: Date.now() });
  if(historyEntry){
    try{ await ref.collection('statusHistory').add({ timestamp: Date.now(), ...historyEntry }); }
    catch(e){ console.error('statusHistory write failed', e); }
  }
}
function toOrderObj(doc){
  const d = doc.data();
  return { ...d, id: doc.id, createdAt: d.createdAt ? new Date(d.createdAt).toISOString() : new Date().toISOString() };
}

function isValidPhone(p){
  if(!p) return false;
  let d = String(p).replace(/[^\d]/g,'');
  if(d.startsWith('00212')) d = d.slice(5); else if(d.startsWith('212')) d = d.slice(3);
  if(d.length===10 && /^0[5-7]/.test(d)) return true;
  if(d.length===9 && /^[5-7]/.test(d)) return true;
  return false;
}

function moroccoMapSVG(opts){
  opts = opts || {};
  const cities = (opts.highlight && opts.highlight.length) ? opts.highlight
    : ['Casablanca','Rabat','Tanger','Marrakech','Agadir','Fès','Oujda','Laâyoune'];
  const cx=190, cy=190, R=142;
  const n = cities.length;
  const nodes = cities.map((name,i)=>{
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    return { name, x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle), angle };
  });
  const rings = [58,100,142].map(rad=>`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="rgba(245,129,10,0.16)" stroke-width="1"/>`).join('');
  const routes = nodes.map((node,i)=>{
    const mx = cx + (node.x-cx)*0.52 - (node.y-cy)*0.14;
    const my = cy + (node.y-cy)*0.52 + (node.x-cx)*0.14;
    return `<path id="rt-${i}" class="route-anim" d="M${cx} ${cy} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${node.x.toFixed(1)} ${node.y.toFixed(1)}" fill="none" stroke="#F5810A" stroke-width="1.1" opacity=".55"/>
      <circle r="2.4" fill="#fff"><animateMotion dur="${3+ (i%3)}s" repeatCount="indefinite"><mpath href="#rt-${i}"/></animateMotion></circle>`;
  }).join('');
  const labels = nodes.map(node=>{
    const dy = node.y > cy+20 ? 17 : node.y < cy-20 ? -12 : (node.x>cx?4:4);
    return `<g class="city-pulse">
      <circle cx="${node.x.toFixed(1)}" cy="${node.y.toFixed(1)}" r="4.5" fill="#F5810A" stroke="#fff" stroke-width="1.3"/>
    </g>
    <text x="${node.x.toFixed(1)}" y="${(node.y+dy).toFixed(1)}" font-size="11" font-family="Space Grotesk" font-weight="700" fill="#fff" text-anchor="middle">${esc(node.name)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
    <g class="radar-ring" style="transform-origin:${cx}px ${cy}px;">${rings}</g>
    ${routes}
    ${labels}
    <circle cx="${cx}" cy="${cy}" r="22" fill="#0B1B3A" stroke="#F5810A" stroke-width="2"/>
    <text x="${cx}" y="${cy+4}" font-size="11" font-family="Space Grotesk" font-weight="800" fill="#fff" text-anchor="middle">EL</text>
  </svg>`;
}

function pageSuivre(){
  let result='';
  if(S.trackResult===false){
    result = `<div class="errbox">Aucun colis trouvé pour ce numéro de suivi. Vérifiez le numéro et réessayez.</div>`;
  } else if(S.trackResult){
    const o = S.trackResult;
    const steps = ['nouvelle_demande','livreur_affecte','a_recuperer','colis_recupere','en_livraison','livre'];
    const labels = ['Demande enregistrée','Livreur affecté','À récupérer','Colis récupéré','En cours de livraison','Livré'];
    const icons = ['✓','✓','✓','✓','🚚','✓'];
    const curIdx = o.status==='nouvelle_demande'?0 : o.status==='livreur_affecte'?1 : o.status==='a_recuperer'?2
      : o.status==='colis_recupere'?3 : o.status==='en_livraison'?4 : o.status==='livre'?5 : -2;
    let tl='';
    if(o.status==='echec_livraison'||o.status==='retour'||o.status==='retour_effectue'){
      tl = steps.map((st,i)=>`<div class="tl-item ${i<=3?'done':'pending'}"><div class="dot">${i<=3?'✓':''}</div><h4>${labels[i]}</h4></div>`).join('')
        + `<div class="tl-item fail"><div class="dot">!</div><h4>${STATUS_LABELS[o.status]}</h4><span>${esc(o.returnReason||'')}</span></div>`;
    } else {
      tl = steps.map((st,i)=>{ const cls = i<curIdx?'done':i===curIdx?'current':'pending';
        return `<div class="tl-item ${cls}"><div class="dot">${i<curIdx?'✓':icons[i]}</div><h4>${labels[i]}</h4>${i===curIdx?`<span>Mis à jour récemment</span>`:''}</div>`; }).join('');
    }
    result = `<div class="recap" style="margin-bottom:20px;">
      <div class="recap-row"><span>Numéro</span><b>${o.trackingNumber}</b></div>
      <div class="recap-row"><span>Trajet</span><b>${esc(o.sender.city)} → ${esc(o.recipient.city)}</b></div>
      <div class="recap-row"><span>Destinataire</span><b>${esc(maskName(o.recipient.name))}</b></div>
    </div><div class="timeline">${tl}</div>`;
  }
  return `<div class="form-shell"><h2>Suivez votre colis</h2><p class="hint">Entrez votre numéro de suivi</p>
    <div class="track-input-row"><input id="trackNum" placeholder="EL-2026-000125" value="${esc(S.trackInput)}"><button class="btn btn-primary" id="trackBtn">SUIVRE</button></div>
    ${result}</div>`;
}

function jobCard(o){

  else if(o.status==='colis_recupere'){ actions = `<div class="job-actions"><button class="b-livre" data-envoi="${o.id}">🚚 DÉMARRER LA LIVRAISON</button></div>`; }
  else if(o.status==='en_livraison'){ actions = `<div class="job-actions"><button class="b-livre" data-livre="${o.id}">🟢 LIVRÉ</button><button class="b-retour" data-retour="${o.id}">🔴 RETOUR</button></div>`; }
  return `<div class="job-card">
    <div class="top"><span class="tn">${o.trackingNumber}</span><span class="badge ${badge[0]}">${badge[1]}</span></div>
    <div class="rowinfo">Destinataire : <b>${esc(o.recipient.name)}</b></div>

    ${actions}</div>`;

function adminStats(){
  const codEncaisse = S.orders.filter(o=>o.status==='livre').reduce((s,o)=>s+Number(o.pkg.cod||0),0);
  const kpis = [
    ['Nouvelles demandes', countBy('nouvelle_demande')],['Colis à récupérer', countBy('livreur_affecte')+countBy('a_recuperer')],
    ['En livraison', countBy('en_livraison')],['Livrés', countBy('livre')],
    ['Échecs', countBy('echec_livraison')],['Retours', countBy('retour')+countBy('retour_effectue')],
    ['COD encaissé', codEncaisse+' DH'],['Total demandes', S.orders.length]
  ];
  const maxVal = Math.max(1, countBy('nouvelle_demande'), countBy('livreur_affecte')+countBy('a_recuperer'), countBy('colis_recupere'), countBy('en_livraison'), countBy('livre'), countBy('echec_livraison'));

    ['Nouvelles demandes', countBy('nouvelle_demande')],['À récupérer', countBy('livreur_affecte')+countBy('a_recuperer')],
    ['Colis récupérés', countBy('colis_recupere')],['En livraison', countBy('en_livraison')],

/* ---------------- HELPERS ---------------- */
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function maskName(name){
  if(!name) return '';
  const parts = name.trim().split(/\s+/);
  return parts.map(p=>p.charAt(0).toUpperCase()+'.').join(' ');
}
function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

/* ---------------- EVENTS ---------------- */
function bindEvents(){
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    const role = b.dataset.role;
    const hash = role==='client' ? '#/' : role==='courier' ? '#/livreur' : '#/admin';
    if(location.hash===hash){ applyRoute(hash); render(); } else { location.hash = hash; }
  });

  /* ---- Courier auth ---- */
  const caToggle = document.getElementById('ca_toggle');
  if(caToggle) caToggle.onclick=()=>{ S.courierAuth.mode = S.courierAuth.mode==='signup'?'login':'signup'; S.courierAuth.err=''; render(); };
  const caSubmit = document.getElementById('ca_submit');
  if(caSubmit) caSubmit.onclick=async()=>{
    const email=val('ca_email'), password=val('ca_password');
    S.courierAuth.email=email; S.courierAuth.password=password;
    try{
      if(S.courierAuth.mode==='signup'){
        const name=val('ca_name'), phone=val('ca_phone');
        S.courierAuth.name=name; S.courierAuth.phone=phone;
        if(!name||!phone||!email||!password){ S.courierAuth.err='Merci de remplir tous les champs.'; render(); return; }
        if(!isValidPhone(phone)){ S.courierAuth.err='Numéro de téléphone invalide (format 06 XX XX XX XX).'; render(); return; }
        if(password.length<6){ S.courierAuth.err='Le mot de passe doit contenir au moins 6 caractères.'; render(); return; }
        const userDoc = await signupCourier(name, phone, email, password);
        S.authUser = userDoc;
        S.courierAuth.mode='login'; S.courierAuth.err=''; render();
      } else {
        if(!email||!password){ S.courierAuth.err='Merci de renseigner votre email et votre mot de passe.'; render(); return; }
        const userDoc = await loginCourier(email, password);
        S.authUser = userDoc;
        S.courierAuth.err=''; applyRoute(location.hash||'#/livreur'); render();
      }
    }catch(e){
      console.error('Courier auth error', e);
      S.courierAuth.err = e && e.message ? e.message : "Une erreur est survenue. Vérifiez vos identifiants.";
      render();
    }
  };
  const courierLogout = document.getElementById('courierLogout');
  if(courierLogout) courierLogout.onclick=async()=>{ await logoutAuth(); location.hash='#/'; };

  /* ---- Admin auth ---- */
  const aaBootstrapLink = document.getElementById('aa_bootstrap_link');
  if(aaBootstrapLink) aaBootstrapLink.onclick=(e)=>{ e.preventDefault(); S.adminAuth.mode='signup'; S.adminAuth.err=''; render(); };
  const aaSubmit = document.getElementById('aa_submit');
  if(aaSubmit) aaSubmit.onclick=async()=>{
    const email=val('aa_email'), password=val('aa_password');
    S.adminAuth.email=email; S.adminAuth.password=password;
    try{
      if(S.adminAuth.mode==='signup'){
        const name=val('aa_name'), phone=val('aa_phone');
        S.adminAuth.name=name; S.adminAuth.phone=phone;
        if(!name||!phone||!email||!password){ S.adminAuth.err='Merci de remplir tous les champs.'; render(); return; }
        if(password.length<6){ S.adminAuth.err='Le mot de passe doit contenir au moins 6 caractères.'; render(); return; }
        const userDoc = await bootstrapFirstAdmin(name, phone, email, password);
        S.authUser = userDoc;
        S.adminAuth.mode='login'; S.adminAuth.err=''; applyRoute(location.hash||'#/admin'); render();
      } else {
        if(!email||!password){ S.adminAuth.err='Merci de renseigner votre email et votre mot de passe.'; render(); return; }
        const userDoc = await loginAdmin(email, password);
        S.authUser = userDoc;
        S.adminAuth.err=''; applyRoute(location.hash||'#/admin'); render();
      }
    }catch(e){
      console.error('Admin auth error', e);
      S.adminAuth.err = e && e.message==='ALREADY_DONE' ? "Le compte administrateur initial a déjà été créé. Utilisez la connexion normale."
        : (e && e.message ? e.message : "Une erreur est survenue. Vérifiez vos identifiants.");
      render();
    }
  };
  const adminLogout = document.getElementById('adminLogout');
  if(adminLogout) adminLogout.onclick=async()=>{ await logoutAuth(); location.hash='#/'; };

  const n1=document.getElementById('next1');
  if(n1) n1.onclick=()=>{ try{
    S.form.sender.name=val('s_name'); S.form.sender.phone=val('s_phone'); S.form.sender.city=val('s_city'); S.form.sender.address=val('s_addr');
    const inv={};
    if(!S.form.sender.name) inv.s_name=true;
    if(!S.form.sender.phone||!isValidPhone(S.form.sender.phone)) inv.s_phone=true;
    if(!S.form.sender.city||!availableCities().includes(S.form.sender.city)) inv.s_city=true;
    if(!S.form.sender.address) inv.s_addr=true;
    if(Object.keys(inv).length){ S.formInvalid=inv; S.formErr='Merci de remplir correctement tous les champs (ville valide comprise).'; render(); return; }
    S.formErr=''; S.formInvalid={}; S.formStep=2; render();
  }catch(e){ S.formErr="Une erreur est survenue, merci de réessayer."; render(); } };
  const back2=document.getElementById('back2'); if(back2) back2.onclick=()=>{ S.formErr=''; S.formInvalid={}; S.formStep=1; render(); };
  const n2=document.getElementById('next2');
  if(n2) n2.onclick=()=>{ try{
    S.form.recipient.name=val('r_name'); S.form.recipient.phone=val('r_phone'); S.form.recipient.city=val('r_city'); S.form.recipient.address=val('r_addr');
    const inv={};
    if(!S.form.recipient.name) inv.r_name=true;
    if(!S.form.recipient.phone||!isValidPhone(S.form.recipient.phone)) inv.r_phone=true;
    if(!S.form.recipient.city||!availableCities().includes(S.form.recipient.city)) inv.r_city=true;
    if(!S.form.recipient.address) inv.r_addr=true;
    if(Object.keys(inv).length){ S.formInvalid=inv; S.formErr='Merci de remplir correctement tous les champs (ville valide comprise).'; render(); return; }
    S.formErr=''; S.formInvalid={}; S.formStep=3; render();
  }catch(e){ S.formErr="Une erreur est survenue, merci de réessayer."; render(); } };
  const back3=document.getElementById('back3'); if(back3) back3.onclick=()=>{ S.formErr=''; S.formInvalid={}; S.formStep=2; render(); };
  const n3=document.getElementById('next3');
  if(n3) n3.onclick=()=>{ try{
    const countRaw = val('p_count'); const codRaw = val('p_cod');
    S.form.pkg.count = countRaw; S.form.pkg.desc=val('p_desc'); S.form.pkg.cod=codRaw; S.form.pkg.note=val('p_note');
    const inv={}; const countNum = Number(countRaw);
    if(!countRaw || !Number.isInteger(countNum) || countNum<1) inv.p_count=true;
    if(!S.form.pkg.desc) inv.p_desc=true;
    const codNum = codRaw===''?0:Number(codRaw);
    if(codRaw!=='' && (isNaN(codNum) || codNum<0)) inv.p_cod=true;
    if(Object.keys(inv).length){ S.formInvalid=inv; S.formErr='Merci de vérifier le nombre de colis, la description et le montant COD.'; render(); return; }
    S.form.pkg.count = countNum; S.form.pkg.cod = codNum;
    S.formErr=''; S.formInvalid={}; S.formStep=4; render();
  }catch(e){ S.formErr="Une erreur est survenue, merci de réessayer."; render(); } };
  const back4=document.getElementById('back4'); if(back4) back4.onclick=()=>{ S.formStep=3; render(); };
  const confirmBtn=document.getElementById('confirmOrder');
  if(confirmBtn) confirmBtn.onclick=async ()=>{ try{
    confirmBtn.disabled=true; confirmBtn.textContent='Enregistrement…';
    const user = await ensureClientAuth();
    if(!user) throw new Error('AUTH_FAILED');
    const price = calcPrice(S.form.sender.city, S.form.recipient.city) ?? S.pricing.diff;
    const orderData = {
      sender:{...S.form.sender}, recipient:{...S.form.recipient}, pkg:{...S.form.pkg},
      price, status:'nouvelle_demande', courierId:null, clientUid: user.uid, returnReason:null, deliveredAt:null
    };
    const order = await createOrder(orderData);
    S.confirmedOrder = order; S.form = blankForm(); S.formStep=1; S.formInvalid={};
    render();
  }catch(e){
    console.error('Order creation failed', e);
    S.formErr="Impossible d'enregistrer le colis pour le moment. Veuillez réessayer.";
    render();
  } };
  const goTrack=document.getElementById('goTrack');
  if(goTrack) goTrack.onclick=()=>{ S.trackInput = S.confirmedOrder.trackingNumber; S.trackResult = S.confirmedOrder; S.confirmedOrder=null; location.hash='#/suivre'; };
  document.querySelectorAll('[data-print-label]').forEach(b=>b.onclick=()=>{ const o = S.orders.find(o=>o.id===b.dataset.printLabel) || S.confirmedOrder; printLabel(o, Number(b.dataset.pkgIdx), Number(b.dataset.pkgTotal)); });
  document.querySelectorAll('[data-pdf-label]').forEach(b=>b.onclick=()=>{ const o = S.orders.find(o=>o.id===b.dataset.pdfLabel) || S.confirmedOrder; const orig=b.textContent; b.textContent='Génération…'; b.disabled=true; downloadLabelPDF(o, Number(b.dataset.pkgIdx), Number(b.dataset.pkgTotal)).finally(()=>{ b.textContent=orig; b.disabled=false; }); });

  const tb=document.getElementById('trackBtn');
  if(tb) tb.onclick=async()=>{
    S.trackInput = val('trackNum');
    if(!S.trackInput){ render(); return; }
    tb.disabled=true; tb.textContent='…';
    try{ S.trackResult = await getOrderByTracking(S.trackInput); }
    catch(e){ console.error('tracking lookup failed', e); S.trackResult = false; }
    tb.disabled=false; tb.textContent='SUIVRE';
    render();
  };

  const calcBtn=document.getElementById('calcTarifBtn');
  if(calcBtn) calcBtn.onclick=()=>{ S.tarifCalc.from = val('calc_from'); S.tarifCalc.to = val('calc_to'); render(); };

  const sendContact=document.getElementById('sendContact');
  if(sendContact) sendContact.onclick=async()=>{
    const name=val('ct_name'), phone=val('ct_phone'), email=val('ct_email'), subject=val('ct_subject'), message=val('ct_message');
    if(!name||!phone||!message){ S.formErr='Merci de renseigner au moins votre nom, téléphone et message.'; render(); return; }
    await saveContactMessage({ name, phone, email, subject, message });
    const waText = `Nouveau message via le site ExpressLivraison%0A%0ANom: ${encodeURIComponent(name)}%0ATéléphone: ${encodeURIComponent(phone)}${email?'%0AEmail: '+encodeURIComponent(email):''}${subject?'%0ASujet: '+encodeURIComponent(subject):''}%0A%0AMessage:%0A${encodeURIComponent(message)}`;
    window.open('https://wa.me/212666052019?text='+waText, '_blank');
    S.formErr=''; S.contactSent=true; render();
  };

  function actorInfo(){ return { changedBy: S.authUser ? S.authUser.uid : 'unknown', changedByRole: S.authUser ? S.authUser.role : 'unknown' }; }

  document.querySelectorAll('[data-recupere]').forEach(b=>b.onclick=async()=>{
    try{ await updateOrder(b.dataset.recupere, { status:'colis_recupere' }, { status:'colis_recupere', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible de mettre à jour ce colis. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-envoi]').forEach(b=>b.onclick=async()=>{
    try{ await updateOrder(b.dataset.envoi, { status:'en_livraison' }, { status:'en_livraison', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible de mettre à jour ce colis. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-livre]').forEach(b=>b.onclick=async()=>{
    try{ await updateOrder(b.dataset.livre, { status:'livre', deliveredAt: Date.now() }, { status:'livre', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible de mettre à jour ce colis. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-retour]').forEach(b=>b.onclick=()=>{ S.retourOrderId=b.dataset.retour; S.retourReason=null; S.retourNote=''; render(); });
  const retourBg=document.getElementById('retourBg'); if(retourBg) retourBg.onclick=(e)=>{ if(e.target.id==='retourBg'){ S.retourOrderId=null; render(); } };
  const retourCancel=document.getElementById('retourCancel'); if(retourCancel) retourCancel.onclick=()=>{ S.retourOrderId=null; render(); };
  document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{ S.retourReason=b.dataset.reason; render(); });
  const retourConfirm=document.getElementById('retourConfirm');
  if(retourConfirm) retourConfirm.onclick=async()=>{
    if(!S.retourReason) return; let reason=S.retourReason;
    if(reason==='Autre'){ const noteEl=document.getElementById('retourNoteInput'); const note=noteEl?noteEl.value.trim():''; if(!note) return; reason=note; }
    try{
      await updateOrder(S.retourOrderId, { status:'echec_livraison', returnReason:reason }, { status:'echec_livraison', note:reason, ...actorInfo() });
      S.retourOrderId=null; render();
    }catch(e){ console.error(e); alert("Impossible d'enregistrer le retour. Veuillez réessayer."); }
  };

  document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{ S.adminTab=b.dataset.atab; render(); });
  const as=document.getElementById('adminSearchInput'); if(as) as.oninput=()=>{ S.adminSearch=as.value; render(); };
  const af=document.getElementById('adminFilterSelect'); if(af) af.onchange=()=>{ S.adminFilter=af.value; render(); };
  document.querySelectorAll('[data-assign]').forEach(sel=>sel.onchange=async()=>{
    const o = S.orders.find(o=>o.id===sel.dataset.assign);
    const courierId = sel.value || null;
    try{
      if(courierId && o.status==='nouvelle_demande'){
        await updateOrder(o.id, { courierId, status:'a_recuperer' }, { status:'a_recuperer', note:'Livreur affecté', ...actorInfo() });
      } else {
        await updateOrder(o.id, { courierId }, { status:o.status, note:'Livreur réaffecté', ...actorInfo() });
      }
    }catch(e){ console.error(e); alert("Impossible d'affecter ce livreur. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=async()=>{
    const orderId = sel.dataset.status;
    try{ await updateOrder(orderId, { status: sel.value }, { status: sel.value, ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible de modifier le statut. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-quick-assign-btn]').forEach(b=>b.onclick=async()=>{
    const sel = document.querySelector(`[data-quick-assign-select="${b.dataset.quickAssignBtn}"]`);
    if(!sel || !sel.value) return;
    try{ await updateOrder(b.dataset.quickAssignBtn, { courierId: sel.value, status:'a_recuperer' }, { status:'a_recuperer', note:'Livreur affecté', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible d'affecter ce livreur. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{
    try{ await updateOrder(b.dataset.retry, { status:'a_recuperer' }, { status:'a_recuperer', note:'Nouvelle tentative', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible de relancer la livraison. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-final-return]').forEach(b=>b.onclick=async()=>{
    try{ await updateOrder(b.dataset.finalReturn, { status:'retour_effectue' }, { status:'retour_effectue', ...actorInfo() }); }
    catch(e){ console.error(e); alert("Impossible d'enregistrer le retour définitif. Veuillez réessayer."); }
  });
  document.querySelectorAll('[data-toggle-courier-active]').forEach(b=>b.onclick=async()=>{
    const newActive = b.dataset.current !== '1';
    try{ await db.collection('users').doc(b.dataset.toggleCourierActive).update({ active:newActive }); }
    catch(e){ console.error(e); alert("Impossible de mettre à jour ce compte livreur."); }
  });
  document.querySelectorAll('[data-courierstatus]').forEach(sel=>sel.onchange=async()=>{
    try{ await db.collection('users').doc(sel.dataset.courierstatus).update({ status: sel.value }); }
    catch(e){ console.error(e); alert("Impossible de mettre à jour le statut du livreur."); }
  });
  document.querySelectorAll('[data-view-history]').forEach(b=>b.onclick=async()=>{
    S.historyModalOrderId = b.dataset.viewHistory; S.historyModalLoading=true; S.historyModalEntries=[]; render();
    try{
      const snap = await db.collection('orders').doc(S.historyModalOrderId).collection('statusHistory').orderBy('timestamp','asc').get();
      S.historyModalEntries = snap.docs.map(d=>d.data());
    }catch(e){ console.error(e); S.historyModalEntries=[]; }
    S.historyModalLoading=false; render();
  });
  const historyBg=document.getElementById('historyBg'); if(historyBg) historyBg.onclick=(e)=>{ if(e.target.id==='historyBg'){ S.historyModalOrderId=null; render(); } };
  const historyClose=document.getElementById('historyClose'); if(historyClose) historyClose.onclick=()=>{ S.historyModalOrderId=null; render(); };

  const savePricingBtn=document.getElementById('savePricingBtn');
  if(savePricingBtn) savePricingBtn.onclick=async()=>{
    try{ await savePricingConfig(Number(val('pricingSame'))||0, Number(val('pricingDiff'))||0); }
    catch(e){ console.error(e); alert("Impossible d'enregistrer les tarifs."); }
  };
  const addCityBtn=document.getElementById('addCityBtn');
  if(addCityBtn) addCityBtn.onclick=async()=>{
    const name=val('newCityNameInput'); const region=val('newCityRegionInput');
    if(!name) return;
    try{ await addCity(name, region); S.newCityName=''; S.newCityRegion=''; render(); }
    catch(e){ console.error(e); alert("Impossible d'ajouter cette ville."); }
  };
  document.querySelectorAll('[data-toggle-city]').forEach(b=>b.onclick=async()=>{
    const c = S.cities.find(c=>c.id===b.dataset.toggleCity);
    try{ await toggleCity(c.id, !c.disponible); }catch(e){ console.error(e); alert("Impossible de mettre à jour cette ville."); }
  });
  document.querySelectorAll('[data-remove-city]').forEach(b=>b.onclick=async()=>{
    try{ await removeCity(b.dataset.removeCity); }catch(e){ console.error(e); alert("Impossible de retirer cette ville."); }
  });
}

/* ---------------- BOOT ---------------- */
window.addEventListener('hashchange', ()=>{ applyRoute(location.hash || '#/'); render(); });
function applyRoute(hash){
  if(hash==='#/livreur'){ S.role='courier'; if(S.authUser && S.authUser.role==='courier') listenCourierOrders(S.authUser.uid); }
  else if(hash==='#/admin'){ S.role='admin'; if(S.authUser && S.authUser.role==='admin'){ listenAdminOrders(); listenCouriersForAdmin(); } }
  else { S.role='client'; S.route=hash; }
}
(async function boot(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#64748B;font-family:Inter,sans-serif;">Chargement d'ExpressLivraison…</div>`;
  if(!db || !auth){
    document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#B8151A;font-family:Inter,sans-serif;">Impossible de charger ExpressLivraison pour le moment. Merci de vérifier votre connexion et de recharger la page.</div>`;
    return;
  }
  try{ await seedCitiesIfEmpty(); await seedPricingIfMissing(); }catch(e){ console.error('seed error', e); }
  listenCities(); listenPricing();

  auth.onAuthStateChanged(async (user)=>{
    if(user && !user.isAnonymous){
      const userDoc = await fetchUserDoc(user.uid);
      S.authUser = userDoc ? { uid:user.uid, ...userDoc } : null;
    } else {
      S.authUser = null;
    }
    applyRoute(location.hash || '#/');
    render();
  });

  applyRoute(location.hash || '#/');
  render();
})();
</script>
</body>
</html>
